[package]
name = "voip_client"
version = "0.1.0"
edition = "2021"

[lib]
name = "voip_client"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
md-5 = "0.10"
hex = "0.4"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
rustls-pki-types = "1"
audiopus = "0.3.0-rc.0"
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
igd-next = { version = "0.15", features = ["aio_tokio"] }
hickory-resolver = { version = "0.25", features = ["tokio", "system-config"] }

[dev-dependencies]
cpal = "0.15"
